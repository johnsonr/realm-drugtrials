# ClinicalTrials.gov search results are already nested records. `brings` in the
# target type turns each run into a small transient evidence subgraph in one
# materialization pass. No registry row is bulk-loaded or persisted.
- name: trialsByDisease
  kind: remote
  operation: searchByDisease
  keyArg: queries
  # Sweep depth, as CONFIG rather than a constant in the handler: raise for an exhaustive
  # landscape, lower for a cheap look. Me merges these into every call and paces them
  # against the `clinicaltrials` bucket below, so depth costs time, not correctness — and
  # whatever is reached is declared in TrialCoverage rather than silently truncated.
  args:
    pageSize: 1000
    maxPages: 10
  # The registry speaks Essie, where AND/OR/NOT are operators ONLY in uppercase — so a natural
  # phrase like "parkinsons and anxiety" returns 2 trials where "Parkinson AND anxiety" returns 64.
  # A plausible number is worse than an error, so the phrase is rewritten into the source's own
  # language before the call. The rewrite is cached, echoed back in the run's scopeQuery, and falls
  # back to the phrase verbatim if it fails.
  keyTransform:
    kind: ai
    instruction: |
      Rewrite a disease phrase as a ClinicalTrials.gov Essie expression for the `query.cond` field.

      Rules:
      - AND, OR and NOT are operators and MUST be uppercase; lowercase reads as a search term.
      - Quote multi-word phrases.
      - Expand a lay or abbreviated name to the registered condition terms it covers, OR-ed together.
      - Express exclusions ("other than X", "excluding X", "not X") with NOT.
      - Return the expression only. Never add commentary, quotes around the whole expression, or a
        field name.
    examples:
      - input: "parkinsons and anxiety"
        output: '(Parkinson Disease OR Parkinsonism) AND (Anxiety OR "Anxiety Disorders")'
      - input: "respiratory diseases other than covid"
        output: '"Respiratory Tract Diseases" NOT (COVID-19 OR "Post-COVID Condition")'
      - input: "Long COVID"
        output: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      - input: "herpes vaccine"
        output: '("Herpes Simplex" OR HSV-1 OR HSV-2) AND Vaccines NOT Zoster'
  records: "$[*]"
  cache:
    kind: ttl
    seconds: 21600
  cost:
    bucket: clinicaltrials
    rate: "2/sec"
    yield: high

- name: trialDetailsByNct
  kind: remote
  operation: detailsByNctIds
  keyArg: nctIds
  records: "$[*]"
  cache:
    kind: ttl
    seconds: 21600
  cost:
    bucket: clinicaltrials
    rate: "2/sec"
    yield: high

- name: publicationsByPmid
  kind: remote
  operation: publicationsByPmid
  keyArg: pmids
  records: "$[*]"
  cache:
    kind: ttl
    seconds: 86400
  cost:
    bucket: ncbi-eutils
    rate: "3/sec"
    yield: high

