id: trial-themes
name: WhatsBeenTried.org — What Recurs
description: |
  The semantic groups a disease's registered trials fall into, each with a real count of how many
  trials it holds and examples from it — grouped by the engine's cluster aggregate over the trial
  titles themselves, never recalled by a model.
params:
  - name: condition
    type: STRING
    label: Disease or condition
    default: Long COVID
  - name: topics
    type: INT
    label: How many groups
    default: 6
spec:
  kind: cypherscript
  script: |
    function sourceQuery(condition) {
      const c = String(condition || "Long COVID").trim();
      const key = c.toLowerCase();
      if (key === "long covid" || key === "pasc" || key === "post-covid condition") {
        return '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"';
      }
      if (key === "herpes vaccine" || key === "herpes simplex vaccine" || key === "hsv vaccine") {
        return '("herpes simplex" OR HSV-1 OR HSV-2) AND vaccine NOT zoster';
      }
      return c;
    }
    function escapedLiteral(value) { return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

    const A = (typeof lensArgs !== "undefined") ? lensArgs : {};
    const condition = String(A.condition || "Long COVID").trim();
    const topics = Math.min(Math.max(Number(A.topics) || 6, 3), 12);
    const registryQuery = sourceQuery(condition);
    // Stated as a brief rather than left to the model's own idea of a summary: what to cover, what NOT to
    // claim, and a length. Registry titles say what is being TRIED, never whether any of it worked, so a
    // summary that slips into efficacy would be describing evidence the rows do not contain.
    const summaryBrief = [
      `In about 100 words, describe what researchers have been trying for ${condition}.`,
      "Cover the main approaches being tested and roughly how the effort divides between them.",
      "These are trial titles from a registry: they record what is being STUDIED, not what worked.",
      "Never state or imply that any intervention is effective, approved, promising or disappointing.",
      "Write plain prose for a patient or a journalist. No headings, no bullet points, no preamble.",
    ].join(" ");

    // themes() and summarize() are ENGINE aggregates: they reduce the group of rows the traversal
    // actually returned. The facts stay the registry's — the model only characterises the set it is
    // handed, and an empty traversal yields null rather than invented prose.
    // cluster() rather than themes(): it EMBEDS the titles and counts the groups, so each cluster
    // carries a real size and its own examples — and it costs N embeddings plus one naming call
    // instead of a model call per batch, which is what pushed this past the script ceiling before.
    // summarize() alongside cluster(): the clusters say WHAT groups exist and how big they are, which is
    // the countable part, but a reader still has to assemble the story from a list of labels. The prose
    // does that assembling — over the same rows, in the same pass, so it cannot describe a different set
    // of trials than the one shown beneath it. Both are ENGINE aggregates: the model only characterises
    // the rows the traversal returned, and an empty traversal yields null rather than invented text.
    const cypher = `MATCH (scope:DiseaseScope {registryQuery:'${escapedLiteral(registryQuery)}'})-[:HAS_TRIAL_SEARCH]->(run:TrialSearchRun)
                    MATCH (run)-[:RETURNED]->(trial:ClinicalTrial)
                    RETURN cluster(trial.title, ${topics}) AS clusters,
                           summarize(trial.title, '${escapedLiteral(summaryBrief)}') AS digest,
                           count(trial) AS trialCount`;

    const res = await gateway.kg.query({ cypher, params: JSON.stringify({}) });
    const rows = (res && res.rows) ? res.rows : (res || []);
    const row = rows[0] || {};

    const clusters = Array.isArray(row.clusters) ? row.clusters : [];
    const digest = typeof row.digest === "string" ? row.digest.trim() : null;
    const readAcross = row.trialCount || 0;
    // The overview sentence is ARITHMETIC over the clusters, not a second model call: it can only
    // ever restate counts the engine produced, so it cannot drift from what is shown below it.
    const largest = clusters[0];
    const narrative = clusters.length
      ? `These ${readAcross} trials fall into ${clusters.length} groups by what they study. The largest, ${largest.label}, covers ${largest.size} of them (${largest.share}%).`
      : null;

    const result = {
      kind: "whatsbeentried-themes",
      schemaVersion: "whatsbeentried-themes/v2",
      condition,
      registryQuery,
      readAcross,
      clusters,
      digest,
      narrative,
      basis: "Grouped by meaning from the titles this query returned; every size is a count of those trials, not an estimate.",
    };
    await gateway.lens.present({ content: JSON.stringify(result) });
